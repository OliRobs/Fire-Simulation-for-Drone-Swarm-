# ============================================================================
# Default fire-weather scenario for wildfire (--weather scenarios/default.ini)
#
# These are the values the app uses with no --weather file (config.h / FireWeather), written out so a scenario
# can be copied and edited without a rebuild. Weather is NOT in the LANDFIRE data: every value here is a
# placeholder until station or forecast data is wired in (README, "Data the Rothermel model still needs").
#
# Format: one "key = value" per line; '#' or ';' starts a comment; blank lines are ignored. Keys left out keep
# these defaults. Unknown keys, repeated keys and out-of-range values are errors (with the line number).
# Booleans: true/false, yes/no, on/off or 1/0. Moistures are percent of oven-dry weight.
# ============================================================================

# --- Wind ---
# Open wind 20 ft (6.1 m) above the vegetation, km/h [0 .. 150]. config.h WIND_SPEED_20FT_KMH: a moderate wind.
wind_20ft_kmh = 20
# Direction the wind blows FROM, degrees clockwise from north [0 .. 360]: 225 = south-west, the prevailing
# fire-season wind in the San Gabriel Mountains. config.h WIND_FROM_DEG.
wind_from_deg = 225
# Midflame / 20-ft wind adjustment factor [0 .. 1]. 0 = worked out per cell from the fuel bed depth and the
# LANDFIRE canopy (Andrews 2012, RMRS-GTR-266). config.h WIND_ADJUSTMENT_FACTOR.
wind_adjustment_factor = 0
# Cap the effective wind at Rothermel's maximum reliable wind (Andrews 2018, RMRS-GTR-371 section 3.2.7). On:
# all 40 fuel models then reproduce Scott & Burgan's (2005) published spread-rate classes. config.h APPLY_WIND_LIMIT.
wind_limit = true
# Terrain wind stability alpha_H / alpha_V [0.05 .. 10]: 1 neutral (WindNinja without its stability option),
# < 1 stable (more air goes round hills), > 1 unstable (more air goes over them). WindNinja's table runs from
# 0.2 (Pasquill class F) to 5 (class A). config.h WIND_STABILITY_ALPHA.
wind_stability_alpha = 1

# --- Dead and live fuel moisture, % ---
# Scott & Burgan (2005, RMRS-GTR-153) moisture scenario D2L2: dry dead fuels, moderately cured live fuels.
# These are the FuelMoisture defaults in rothermel.h.
moisture_1h_pct = 6
moisture_10h_pct = 7
moisture_100h_pct = 8
# Live herbaceous [30 .. 300]: 30 = fully cured, 120 = green
moisture_live_herb_pct = 60
moisture_live_woody_pct = 90

# --- Crown fire ---
# Allow torching and active crown fire where LANDFIRE maps canopy (Van Wagner 1977, Finney 1998).
# config.h ENABLE_CROWN_FIRE.
crown_fire = true
# Live foliar moisture of the canopy, % [30 .. 300]. 100 % is the usual default (Scott & Reinhardt 2001);
# RMRS-GTR-220 gives 75-150 % as the normal range. config.h FOLIAR_MOISTURE_PCT.
foliar_moisture_pct = 100
